<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>APO Podkarpacki OTS Tracker</title>

<link rel="stylesheet" href="/static/css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:'Cinzel',serif;
  color:#f3caca;
  background:
    linear-gradient(rgba(0,0,0,.82), rgba(0,0,0,.95)),
    url("/static/bg.jpg") center/cover no-repeat fixed;
}

/* CLOCK */
#clockBox{
  position:fixed;
  top:20px;
  right:30px;
  text-align:right;
  z-index:20000;
  color:#ff6a6a;
  text-shadow:0 0 15px rgba(255,0,0,.7);
  pointer-events:none;
}
#clockTime{font-size:32px;font-weight:700}
#clockDate{font-size:14px;letter-spacing:.12em}

/* INTRO */
#intro{
  position:fixed;
  inset:0;
  background:black;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
  overflow:hidden;
  transition:opacity 1.2s ease, filter 1.2s ease;
}
#intro.fade-out{
  opacity:0;
  filter:blur(8px);
  pointer-events:none;
}
#intro video{
  position:absolute;
  inset:0;
  width:100vw;
  height:100vh;
  object-fit:cover;
}
#intro img{
  position:relative;
  z-index:2;
  width:min(360px,70vw);
  max-height:60vh;
  object-fit:contain;
  opacity:0;
  transform:scale(.85);
  animation:introIn 1.8s forwards;
}
@keyframes introIn{
  0%{opacity:0;transform:scale(.85)}
  60%{opacity:1;transform:scale(1.05)}
  100%{opacity:1;transform:scale(1)}
}
</style>
</head>

<body>

<div id="clockBox">
  <div id="clockTime"></div>
  <div id="clockDate"></div>
</div>

<div id="intro">
  <video autoplay muted playsinline loop>
    <source src="/static/video/intro.mp4" type="video/mp4">
  </video>
  <img src="/static/intro/logo.png">
</div>

<header><img src="/static/header/apo-tracker.png"></header>

<div class="container">
  <!-- TU ZOSTAJE CAŁA TWOJA STRUKTURA CARD / SPEED / DAY / CHART BEZ ZMIAN -->
</div>

<footer>designed by Zohanek © <span id="year"></span></footer>

<script src="/static/js/app.js" defer></script>
</body>
</html>
